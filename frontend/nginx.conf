# Keep a caller-supplied correlation ID, otherwise use nginx's request ID (AGENT.md §53).
map $http_x_correlation_id $correlation_id {
    ""      $request_id;
    default $http_x_correlation_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location ~ ^/(api|v3/api-docs|swagger-ui)(/|\.html|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $correlation_id;
    }

    # Actuator stays internal; it is not proxied.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
