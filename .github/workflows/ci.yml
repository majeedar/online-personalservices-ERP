name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (architecture, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Integration tests use Testcontainers (Docker is available on the runner), ADR-012.
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports

  mock-erp:
    name: mock-erp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-erp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mock-erp/pom.xml
      - run: mvn -B verify

  frontend:
    name: Frontend (unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    needs: [backend, mock-erp, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the application
        run: |
          # /api/v1/auth/session answers 401 once nginx and the backend are both up.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/v1/auth/session || true)
            if [ "$code" = "401" ]; then echo "ready after ${i} attempts"; exit 0; fi
            sleep 5
          done
          echo "application did not become ready"; exit 1
      - name: Let the demo data and first exports settle
        run: sleep 15
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            compose.log
            frontend/test-results
      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - name: Stop the stack
        if: always()
        run: docker compose down -v
